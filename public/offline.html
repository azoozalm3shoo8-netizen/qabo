<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>قبو — بدون اتصال</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #f3f4f6;
        color: #1f2937;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        padding: 1rem;
        text-align: center;
      }
      .card {
        background: #fff;
        border-radius: 1rem;
        padding: 2rem;
        max-width: 22rem;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      }
      h1 {
        color: #1b7f7a;
        font-size: 1.25rem;
        margin-bottom: 0.5rem;
      }
      p {
        font-size: 0.9rem;
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>لا يوجد اتصال</h1>
      <p>تحقق من الشبكة ثم أعد تحميل الصفحة.</p>
    </div>
  </body>
</html>
